<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login AntoBano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Inicia sesión en AntoBano!</h1>
    <form action="login.html" method="post">
        <label>Correo:</label>
        <input type="email" placeholder="Escribe tu correo">
        <label>Contraseña:</label>
        <input type="password" placeholder="Escribe tu contraseña">
        <button type="submit">Iniciar sesión</button>  
        <p class="separador">O</p>
        <button type="button" class="btn-google" onclick="window.location.href='inicio.html'">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Logo de Google">
            Regístrate en Google
        </button>
        <p>¿No tienes una cuenta? <a href="index.html">Regístrate</a></p>
    </form>
</body>
</html>
