<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AntoBano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pantalla-auth">

    <div class="tarjeta-auth">
        <div class="marca-auth">
            <span class="insignia-marca">AntoBano Delivery</span>
            <h1>¡Bienvenido de nuevo!</h1>
            <p class="subtitulo-auth">Inicia sesión para hacer tu pedido</p>
        </div>

        <!-- Notificación roja de error -->
        <div id="alerta-login" class="alerta-auth" style="display: none;"></div>

        <form id="form-login" onsubmit="procesarLogin(event)" novalidate>
            <div class="grupo-campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" oninput="limpiarError(this)" required>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña</label>
                <div class="contenedor-pass">
                    <input type="password" id="password" placeholder="Escribe tu contraseña" oninput="limpiarError(this)" required>
                    <button type="button" class="btn-ojito" onclick="verPassword()" title="Mostrar u ocultar contraseña">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-principal">Iniciar sesión</button>

            <div class="separador"><span>O continúa con</span></div>

            <button type="button" class="btn-google" onclick="entrarConGoogle()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Logo de Google">
                Continuar con Google
            </button>

            <p class="enlace-cambio">
                ¿Aún no tienes cuenta? <a href="index.html">Regístrate aquí</a>
            </p>
        </form>
    </div>

    <script>
        function verPassword() {
            const inputPass = document.getElementById('password');
            inputPass.type = (inputPass.type === 'password') ? 'text' : 'password';
        }

        function limpiarError(input) {
            input.classList.remove('campo-error');
        }

        function mostrarNotificacionLogin(input, mensaje) {
            const alerta = document.getElementById('alerta-login');
            alerta.textContent = '⚠️ ' + mensaje;
            alerta.style.display = 'block';
            if (input) {
                input.classList.add('campo-error');
                input.focus();
            }
        }

        function procesarLogin(evento) {
            evento.preventDefault();
            const inputCorreo = document.getElementById('correo');
            const inputPass = document.getElementById('password');

            const correo = inputCorreo.value.trim();
            const password = inputPass.value.trim();
            const formatoCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!formatoCorreo.test(correo)) {
                mostrarNotificacionLogin(inputCorreo, 'Por favor, ingresa un correo electrónico válido.');
                return;
            }

            if (password.length < 6) {
                mostrarNotificacionLogin(inputPass, 'La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            document.getElementById('alerta-login').style.display = 'none';
            const nombreUsuario = correo.split('@')[0];
            localStorage.setItem('antobano_usuario', nombreUsuario);
            window.location.href = 'inicio.html';
        }

        function entrarConGoogle() {
            localStorage.setItem('antobano_usuario', 'Cliente AntoBano');
            window.location.href = 'inicio.html';
        }
    </script>

</body>
</html>
